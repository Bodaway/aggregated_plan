query TimesheetDraft($date: NaiveDate!) {
  timesheetDraft(date: $date) {
    date
    status
    targetHours
    roundingIncrement
    totalHours
    dayConfidence
    unattributedHours
    lines {
      gryzzlyProjectId
      projectName
      hours
      isPinned
      confidence
    }
    unresolved {
      sourceRef
      label
      at
    }
    blocks {
      startTime
      endTime
      gryzzlyProjectId
      kind
      hours
    }
  }
}
