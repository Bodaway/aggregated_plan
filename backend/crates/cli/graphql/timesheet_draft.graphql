query TimesheetDraft($date: NaiveDate!) {
  timesheetDraft(date: $date) {
    date
    status
    targetHours
    roundingIncrement
    totalHours
    dayConfidence
    unattributedHours
    lines {
      gryzzlyProjectId
      projectName
      hours
      isPinned
      confidence
    }
    unresolved {
      sourceRef
      label
      at
    }
    quarters {
      index
      startMin
      endMin
      hours
      oooHours
      declarableHours
      confidence
      shares {
        laneKey
        taskId
        label
        gryzzlyProjectId
        presenceMinutes
        hours
        isPinned
      }
    }
    lanes {
      laneKey
      label
      gryzzlyProjectId
      outsideMinutes
      intervals {
        startMin
        endMin
      }
    }
    outsideWorkday {
      laneKey
      label
      minutes
    }
  }
}
