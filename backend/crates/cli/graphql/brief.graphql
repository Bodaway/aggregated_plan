query Brief($variant: BriefVariantGql!, $projectId: ID, $date: NaiveDate) {
  brief(variant: $variant, projectId: $projectId, date: $date) {
    variant
    date
    lines
    preferences {
      id
      reference
      title
      stakeholders
      occurredOn
    }
    preferenceTotal
    deadlines {
      title
      daysUntil
    }
    deadlineTotal
    commitments {
      id
      reference
      title
      stakeholders
      occurredOn
    }
    commitmentTotal
    decisions {
      id
      reference
      title
      stakeholders
      occurredOn
    }
    decisionTotal
    decisionsScopedToProject
    pendingCount
    consolidation {
      daysAgo
      stale
    }
  }
}
