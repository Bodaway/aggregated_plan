query ListTasks($filter: TaskFilterInput, $allOccurrences: Boolean) {
  tasks(filter: $filter, first: 100, allOccurrences: $allOccurrences) {
    totalCount
    edges {
      node {
        id
        title
        sourceId
        status
        urgency
        impact
        trackingState
        deadline
      }
    }
  }
}
