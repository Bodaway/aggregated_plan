"""
The cross-entity search (`aplan search`): tasks, worklog, meetings and
memories that match the same query, one already-capped group per entity.
Selection, matching and capping all happen in `domain`/`application` —
this type only carries their shape across the wire.
"""
type SearchGql {
	tasks: [SearchHitGql!]!
	"""
	How many tasks matched, before the group cap.
	"""
	taskTotal: Int!
	worklog: [SearchHitGql!]!
	"""
	How many worklog entries matched, before the group cap.
	"""
	worklogTotal: Int!
	meetings: [SearchHitGql!]!
	"""
	How many meetings matched, before the group cap.
	"""
	meetingTotal: Int!
	memories: [SearchHitGql!]!
	"""
	How many memories matched, before the group cap.
	"""
	memoryTotal: Int!
}

"""
One search hit, reduced to what a caller needs to decide whether to drill in.
"""
type SearchHitGql {
	id: String!
	title: String!
	occurredOn: NaiveDate!
}

type SearchableTaskGql {
	id: ID!
	title: String!
	sourceId: String
	source: SourceGql!
	assignee: String
	projectName: String
	tags: [String!]!
	description: String
	status: TaskStatusGql!
}

"""
Microsoft session status returned by the `session` query.
"""
type SessionGql {
	authenticated: Boolean!
	account: String
}

"""
What a session was told to do with its worklog.
"""
enum SessionModeGql {
	TRACKING
	OFF
}

type SessionTaskSummaryGql {
	id: ID!
	title: String!
}

type SignalMappingGql {
	id: ID!
	kind: MappingKindGql!
	pattern: String!
	branchPattern: String
	gryzzlyProjectId: String!
	gryzzlyProjectName: String
	isEnabled: Boolean!
}

"""
A file the import did not turn into a memory, and why.
"""
type SkippedMemoryFileGql {
	fileName: String!
	"""
	`already_imported` | `no_frontmatter` | `no_title`.
	"""
	reason: String!
}

"""
Result of `repairOrphanedSlots`.

Everything a reader needs to CHECK the repair rather than trust it: per date what
would be dropped and what would be written, and per task the hours before and
after. `applied: false` means nothing was written. An empty `dates` means the range
held no damage — a success, not a refusal, so the same call doubles as the
verification that a previous repair worked.
"""
type SlotRepairResultGql {
	applied: Boolean!
	from: NaiveDate!
	to: NaiveDate!
	dates: [DateRepairGql!]!
	tasks: [RepairedTaskGql!]!
	orphansDropped: Int!
	"""
	Total hours the dropped orphans were holding. Compare against the tasks'
	`hoursAfter`: that is where the time went — unless a date shows orphans
	dropped and no slot written, which is time the worklog can no longer explain.
	"""
	orphanHours: Float!
	slotsDiscarded: Int!
	slotsWritten: Int!
}

"""
Which projection owns an activity slot.
"""
enum SlotSourceGql {
	WORKLOG
	MANUAL
}

"""
GraphQL enum for task source.
"""
enum SourceGql {
	JIRA
	EXCEL
	OBSIDIAN
	PERSONAL
	OUTLOOK
	GRYZZLY
}

"""
Result of `supersedeMemory`: BOTH rows survive. `invalidated` carries the end
of its validity and a pointer to `successor`.
"""
type SupersedeMemoryResultGql {
	invalidated: MemoryGql!
	successor: MemoryGql!
}

"""
GraphQL enum for sync source status.
"""
enum SyncSourceStatusGql {
	IDLE
	SYNCING
	SUCCESS
	ERROR
	"""
	No usable credentials, so no sync was attempted. Not a failure.
	"""
	NOT_CONFIGURED
}

type SyncStatusGql {
	source: SourceGql!
	lastSyncAt: DateTime
	status: SyncSourceStatusGql!
	errorMessage: String
}

type TagGql {
	id: ID!
	name: String!
	color: String
}

type TaskActivitySummaryGql {
	taskId: ID
	taskTitle: String
	sourceId: String
	totalHours: Float!
	dailyHours: [Float!]!
}

"""
Relay-style connection for paginated task results.
"""
type TaskConnection {
	edges: [TaskEdge!]!
	pageInfo: PageInfo!
	totalCount: Int!
}

type TaskEdge {
	node: TaskGql!
	cursor: String!
}

"""
Filter input for querying tasks.
"""
input TaskFilterInput {
	status: [TaskStatusGql!]
	source: [SourceGql!]
	projectId: ID
	assignee: String
	deadlineBefore: NaiveDate
	deadlineAfter: NaiveDate
	tagIds: [ID!]
	trackingState: [TrackingStateGql!]
	"""
	Exact match on `tasks.source_id` (e.g. a Jira key).
	"""
	sourceId: String
	"""
	Case-insensitive substring match on `tasks.title`.
	"""
	titleContains: String
}

type TaskGql {
	id: ID!
	title: String!
	description: String
	"""
	User-owned markdown notes — preserved across Jira syncs.
	"""
	notes: String
	source: SourceGql!
	sourceId: String
	jiraStatus: String
	status: TaskStatusGql!
	projectId: ID
	"""
	The associated project. Resolved via data loader in a later task.
	Returns None for now.
	"""
	project: ProjectSummaryGql
	assignee: String
	"""
	Person this task is delegated to. User-owned — preserved across syncs.
	"""
	delegatedTo: String
	deadline: NaiveDate
	plannedStart: DateTime
	plannedEnd: DateTime
	estimatedHours: Float
	urgency: UrgencyLevelGql!
	urgencyManual: Boolean!
	impact: ImpactLevelGql!
	"""
	Computed Eisenhower quadrant based on urgency and impact.
	"""
	quadrant: QuadrantGql!
	"""
	R73: which commitment this task is late on, as of the server's day. Derived at
	read time — lateness is never persisted.
	"""
	overdueKind: OverdueKindGql!
	"""
	R73: calendar days elapsed since the overrun date of `overdueKind`.
	Null when the task is not late.
	"""
	overdueDays: Int
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	Tags associated with this task. Stub: returns empty vec for now.
	"""
	tags: [TagGql!]!
	"""
	Tag IDs associated with this task.
	"""
	tagIds: [ID!]!
	trackingState: TrackingStateGql!
	jiraRemainingSeconds: Int
	jiraOriginalEstimateSeconds: Int
	jiraTimeSpentSeconds: Int
	remainingHoursOverride: Float
	estimatedHoursOverride: Float
	"""
	Computed: local override > Jira remaining > None
	"""
	effectiveRemainingHours: Float
	"""
	Computed: local override > Jira estimate > estimated_hours
	"""
	effectiveEstimatedHours: Float
	"""
	ID of the recurrence template this task was generated from, if any.
	"""
	recurrenceId: ID
	"""
	The specific occurrence date this task instance fills (within its recurrence series).
	"""
	occurrenceDate: NaiveDate
	"""
	True when this task is a generated instance of a recurrence template.
	"""
	isRecurring: Boolean!
	"""
	The assigned Gryzzly task (with project context), or null if unassigned.
	
	Returns `AssignedGryzzlyTaskGql` with three stale states:
	1. `stale = false` — catalog row is active (current).
	2. `stale = true`, `name = Some` — catalog row is soft-disabled.
	3. `stale = true`, `name = None` — catalog row is missing (orphaned assignment).
	"""
	gryzzlyTask: AssignedGryzzlyTaskGql
}

"""
GraphQL enum for task status.
"""
enum TaskStatusGql {
	TODO
	IN_PROGRESS
	DONE
	BLOCKED
	"""
	Marks a skipped occurrence of a recurring task.
	"""
	CANCELLED
}

"""
One task's hours on the affected days, before and after the correction.
"""
type TaskTimeChangeGql {
	taskId: ID!
	hoursBefore: Float!
	hoursAfter: Float!
}

type TimesheetLineGql {
	gryzzlyProjectId: String
	projectName: String
	hours: Float!
	isPinned: Boolean!
	confidence: ConfidenceGql!
	sourceRefs: [String!]!
}

enum TimesheetStatusGql {
	DRAFT
	VALIDATED
	SUBMITTED
	DAY_OFF
}

"""
GraphQL enum for task tracking state (triage workflow).
"""
enum TrackingStateGql {
	INBOX
	FOLLOWED
	DISMISSED
}

type UnresolvedSignalGql {
	sourceRef: String!
	label: String!
	at: NaiveDateTime!
}

"""
Input for updating an existing activity slot.
"""
input UpdateActivitySlotInput {
	"""
	Change the associated task. Null clears it, undefined leaves unchanged.
	"""
	taskId: ID
	"""
	Update the start time.
	"""
	startTime: DateTime
	"""
	Update the end time.
	"""
	endTime: DateTime
}

"""
Input for updating a recurring task template.

Every field is `Option`-wrapped: `None` means "leave unchanged".
For nullable domain fields (description, notes, etc.) the inner value
follows the same `Option<Option<T>>` pattern used by `UpdateTaskInput`.
"""
input UpdateRecurringTaskInput {
	title: String
	description: String
	notes: String
	projectId: ID
	urgency: UrgencyLevelGql
	impact: ImpactLevelGql
	estimatedHours: Float
	tagIds: [ID!]
	rule: RecurrenceRuleInput
	startsOn: NaiveDate
	endsOn: NaiveDate
	maxOccurrences: Int
}

"""
Input for updating an existing task.
"""
input UpdateTaskInput {
	title: String
	description: String
	notes: String
	projectId: ID
	"""
	Set a date to change the deadline, explicit null to clear, omit to leave unchanged.
	"""
	deadline: NaiveDate = null
	plannedStart: DateTime = null
	plannedEnd: DateTime
	estimatedHours: Float
	status: TaskStatusGql
	impact: ImpactLevelGql
	urgency: UrgencyLevelGql
	tagIds: [ID!]
	"""
	Set to Some(Some(val)) to override, Some(None) to clear, None to leave unchanged.
	"""
	remainingHoursOverride: Float
	"""
	Set to Some(Some(val)) to override, Some(None) to clear, None to leave unchanged.
	"""
	estimatedHoursOverride: Float
	"""
	Set to a name to delegate, explicit null to clear, omit to leave unchanged.
	"""
	delegatedTo: String = null
}

"""
GraphQL enum for urgency level.
"""
enum UrgencyLevelGql {
	LOW
	MEDIUM
	HIGH
	CRITICAL
}

"""
GraphQL enum for the week-of-month position.
"""
enum WeekOfMonthGql {
	FIRST
	SECOND
	THIRD
	FOURTH
	LAST
}

"""
GraphQL enum for days of the week.
"""
enum WeekdayGql {
	MONDAY
	TUESDAY
	WEDNESDAY
	THURSDAY
	FRIDAY
	SATURDAY
	SUNDAY
}

type WeeklyActivitySummaryGql {
	weekStart: NaiveDate!
	weekEnd: NaiveDate!
	totalHours: Float!
	dailyTotals: [DailyActivityTotalGql!]!
	taskBreakdown: [TaskActivitySummaryGql!]!
}

type WeeklyWorkloadGql {
	weekStart: NaiveDate!
	"""
	Number of half-day slots available in the week (default 10).
	"""
	capacity: Int!
	"""
	Total planned task hours for the week.
	"""
	totalPlanned: Float!
	"""
	Total meeting hours for the week.
	"""
	totalMeetings: Float!
	capacityHours: Float!
	"""
	Whether the weekly workload exceeds capacity.
	"""
	overload: Boolean!
	"""
	Excess hours over capacity (0.0 if not overloaded).
	"""
	excessHours: Float!
	halfDays: [HalfDaySlotGql!]!
	"""
	ISO weekday numbers for working days (1=Mon … 7=Sun).
	"""
	workingDays: [Int!]!
}

"""
Filter input for `worklogEntries`.
When `recurrence_id` is provided, it wins over `task_ids` and returns all entries
whose task belongs to the given recurrence template.
"""
input WorklogEntryFilterInput {
	taskIds: [ID!]
	recurrenceId: ID
	from: DateTime
	to: DateTime
	limit: Int
	offset: Int
}

type WorklogEntryGql {
	id: ID!
	taskId: ID!
	"""
	Hydrated task. Null only if the task was deleted between list and resolve
	(shouldn't happen under normal conditions thanks to the FK cascade).
	"""
	task: TaskGql
	body: String!
	loggedAt: DateTime!
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	The occurrence date of the task this entry belongs to.
	`Some` for recurring instances, `None` for one-shot tasks.
	"""
	occurrenceDate: NaiveDate
	"""
	The session that wrote this entry. Null is the human, working by hand.
	"""
	sessionId: String
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: CombinedQuery
	mutation: CombinedMutation
}

