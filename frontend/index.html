<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `/vite.svg` n'a jamais existé dans public/ : ce lien 404ait à chaque
         chargement. Les vraies icônes de la PWA font l'affaire. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Nom sous l'icône de l'écran d'accueil : iOS préfère cette méta au
         `short_name` du manifeste. -->
    <meta name="apple-mobile-web-app-title" content="aplan" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Aggregated Plan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
