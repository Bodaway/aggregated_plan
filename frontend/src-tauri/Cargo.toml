[package]
name = "aplan-hud"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the aplan HUD"

# DO NOT attach this crate to the backend/ workspace: it would pull WebKit
# into every `cargo test` of the API. The empty [workspace] key isolates it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Backs the Station block's `station_stats` IPC command (spec §5: CPU/RAM/
# network telemetry is local and ephemeral, so it never touches GraphQL).
# Pinned to the 0.38 line: 0.39 requires rustc 1.95, and this machine's
# toolchain is 1.94.1 (verified against crates.io's own rust_version field
# per release, not guessed).
sysinfo = "0.38"
# The webview cannot see a Hyprland special-workspace toggle: measured on the
# real compositor, `document.visibilityState` stays "visible" the whole time
# the overlay is hidden. The script that performs the toggle is the only thing
# that knows, so it tells us over SIGUSR1 (shown) / SIGUSR2 (hidden) and this
# crate turns that into a Tauri event. `signal-hook` rather than a raw handler
# because a signal handler may not allocate or lock, and emitting an event
# does both — `Signals` moves the work onto an ordinary thread.
signal-hook = "0.3"
# For `SIGRTMIN()`, which is a glibc function, not a constant.
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
