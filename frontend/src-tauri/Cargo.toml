[package]
name = "aplan-hud"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the aplan HUD"

# DO NOT attach this crate to the backend/ workspace: it would pull WebKit
# into every `cargo test` of the API. The empty [workspace] key isolates it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
